## Host deep sleep + coprocessor light sleep. Associates via the shared example
## helper, sleeps from hosted's own CLI; iperf + ping are available for
## throughput / reachability testing from the host console.
dependencies:
  espressif/iperf-cmd:
    matches:
      - if: "idf_version >=6.0"
        version: "~0.1.3"
      - if: "idf_version <6.0"
        version: "~0.1.1"
  esp-qa/ping-cmd:
    version: "~1.0.0"
  espressif/esp_hosted:
    version: "*"
    override_path: "../../../../../.."
  espressif/esp_wifi_remote:
    version: ">=1.3.1"
    rules:
      - if: "target in [esp32p4, esp32h2]"
      - if: "idf_version <6.1"
  idf:
    version: ">=5.5"

dependencies:
    espressif/esp_hosted:
      override_path: "../../../../.."
      version: "*"
    espressif/esp_wifi_remote:
      version: ">=1.3.1"
      rules:
        - if: "target in [esp32p4, esp32h2]"
        - if: "idf_version <6.1"
    idf:
      version: ">=5.5"
    espressif/mqtt:
      version: "*"
      rules:
        - if: "idf_version >= 6.0"

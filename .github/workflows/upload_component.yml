name: Push component to https://components.espressif.com
on:
  push:
    branches:
      - master
      - unified_release

jobs:
  upload_components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Registry self-containment: each example resolves its shared component via a
      # relative override_path in the repo checkout; the registry strips override_path,
      # so an extracted example must carry the component itself. Copy it into each
      # example's components/ (IDF auto-discovers it) before upload. Explicit per
      # example on purpose — no globbing, so placement is exact.
      - name: Bundle shared example components into examples
        run: |
          set -e
          # esp_hosted_examples_common -> CP examples
          mkdir -p examples/network_split/station/cp/components
          cp -r examples/common_components/esp_hosted_examples_common examples/network_split/station/cp/components/
          mkdir -p examples/network_split/iperf/cp/components
          cp -r examples/common_components/esp_hosted_examples_common examples/network_split/iperf/cp/components/
          mkdir -p examples/power_save/host/network_split__host_deep_sleep/cp/components
          cp -r examples/common_components/esp_hosted_examples_common examples/power_save/host/network_split__host_deep_sleep/cp/components/
          mkdir -p examples/power_save/host+cp/network_split__host_deep_sleep_cp_light_sleep/cp/components
          cp -r examples/common_components/esp_hosted_examples_common examples/power_save/host+cp/network_split__host_deep_sleep_cp_light_sleep/cp/components/
          # esp_hosted_examples_common -> network_split mcu_host examples
          mkdir -p examples/network_split/station/mcu_host/components
          cp -r examples/common_components/esp_hosted_examples_common examples/network_split/station/mcu_host/components/
          mkdir -p examples/network_split/iperf/mcu_host/components
          cp -r examples/common_components/esp_hosted_examples_common examples/network_split/iperf/mcu_host/components/
          # ---- Bluetooth (canonical <stack>_<transport>/<scenario>/mcu_host layout) ----
          # esp_hosted_hci_bluedroid -> bluedroid_hosted_hci mcu_host examples
          for d in ble_advertise_minimal ble_compatibility_test ble_gatt_server bt_hid_mouse classic_bt_discovery controller_mac_addr; do
            mkdir -p "examples/bluetooth/bluedroid_hosted_hci/$d/mcu_host/components"
            cp -r examples/common_components/esp_hosted_hci_bluedroid "examples/bluetooth/bluedroid_hosted_hci/$d/mcu_host/components/"
          done
          # esp_hosted_hci_nimble -> nimble_hosted_hci mcu_host examples
          for d in bleprph_gatt bleprph_minimal bleprph_wifi_coex; do
            mkdir -p "examples/bluetooth/nimble_hosted_hci/$d/mcu_host/components"
            cp -r examples/common_components/esp_hosted_hci_nimble "examples/bluetooth/nimble_hosted_hci/$d/mcu_host/components/"
          done
          # esp_hosted_examples_common -> BT Wi-Fi coex mcu_host
          mkdir -p examples/bluetooth/nimble_hosted_hci/bleprph_wifi_coex/mcu_host/components
          cp -r examples/common_components/esp_hosted_examples_common examples/bluetooth/nimble_hosted_hci/bleprph_wifi_coex/mcu_host/components/
          # nimble_peripheral_utils -> standard_hci UART mcu_host
          mkdir -p examples/bluetooth/nimble_standard_hci/bleprph_host_only_uart/mcu_host/components
          cp -r examples/common_components/nimble_peripheral_utils examples/bluetooth/nimble_standard_hci/bleprph_host_only_uart/mcu_host/components/

      - name: Strip bundled local-component deps from example manifests
        run: |
          set -e
          for e in \
            examples/network_split/station/cp \
            examples/network_split/iperf/cp \
            examples/power_save/host/network_split__host_deep_sleep/cp \
            examples/power_save/host+cp/network_split__host_deep_sleep_cp_light_sleep/cp \
            examples/network_split/station/mcu_host \
            examples/network_split/iperf/mcu_host \
            examples/bluetooth/nimble_hosted_hci/bleprph_gatt/mcu_host \
            examples/bluetooth/nimble_hosted_hci/bleprph_minimal/mcu_host \
            examples/bluetooth/nimble_hosted_hci/bleprph_wifi_coex/mcu_host \
            examples/bluetooth/nimble_standard_hci/bleprph_host_only_uart/mcu_host \
            examples/bluetooth/bluedroid_hosted_hci/ble_advertise_minimal/mcu_host \
            examples/bluetooth/bluedroid_hosted_hci/ble_compatibility_test/mcu_host \
            examples/bluetooth/bluedroid_hosted_hci/ble_gatt_server/mcu_host \
            examples/bluetooth/bluedroid_hosted_hci/bt_hid_mouse/mcu_host \
            examples/bluetooth/bluedroid_hosted_hci/classic_bt_discovery/mcu_host \
            examples/bluetooth/bluedroid_hosted_hci/controller_mac_addr/mcu_host ; do
            python3 tools/ci/strip_bundled_deps.py "$e/main/idf_component.yml" \
              esp_hosted_examples_common esp_hosted_hci_nimble esp_hosted_hci_bluedroid nimble_peripheral_utils
          done

      # Registry example pages: the registry publishes the cp/ mcu_host/ esp_host/
      # project dirs (not the top-level example README). Generate their READMEs
      # from the marker-tagged top README at publish time (see tools/gen_registry_readmes.py
      # and docs/design/registry-example-readme-generation.md). In-place, CI-only —
      # never committed. Non-marked examples (e.g. bluetooth) keep their own READMEs.
      - name: Generate registry example READMEs
        run: python3 tools/gen_registry_readmes.py

      # The registry renders a CHANGELOG.md at the component root; ours lives at
      # docs/changelog.md. Stage it at the root for upload (CI-only, not committed).
      - name: Stage changelog at component root for the registry
        run: cp docs/changelog.md CHANGELOG.md

      - name: Upload component to the component registry
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "esp_hosted:."
          namespace: "espressif"
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}

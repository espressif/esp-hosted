# Shared pytest config for ESP-Hosted test suites (emu + hw).
# Invoked via `python3 tools/eh.py test [emu|hw] …`.
[pytest]
# importlib import mode: the one-shot `eh.py test emu` collects tests/suites +
# tests/emu-mcu + tests/emu-linux together, and same-basename files across those
# trees (e.g. test_power_save.py in suites/ and emu-mcu/ during the suites
# migration) collide under the legacy prepend mode. importlib imports each file
# under a unique module id, so duplicate basenames coexist without __init__.py.
addopts = -ra --import-mode=importlib
# Live step trace (set -x for runs) — the 'eh' logger streams build/launch/expect
# steps to the console as they happen, so a long build is never a blind wait.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s  %(message)s
log_cli_date_format = %H:%M:%S
# Overall per-test hard cap (pytest-timeout). Overridable: `eh.py test … --timeout=N`
# or per test `@pytest.mark.timeout(N)`. Per-PHASE budgets are separate env vars:
#   EH_BUILD_TIMEOUT (build), EH_EMU_TIMEOUT (emulator), EH_EXPECT_SCALE (expects).
# Retention: at each run start the lab prunes tests/.work/{runs,cache} entries
#   older than EH_RETENTION_DAYS (default 30; 0 disables). Active caches survive
#   (their mtime is bumped on reuse).
timeout = 900
timeout_method = thread
markers =
    boot: transport bring-up / handshake
    system: system + CP firmware info
    wifi: Wi-Fi station / softap / scan
    nw_split: network-split (802.3) routing
    power_save: host deep-sleep + CP light-sleep + wake
    rpc: RPC control surface
    bt: Bluetooth / HCI
    ota: over-the-air update
    gpio: GPIO expander
    coex: Wi-Fi/BT coexistence
    perf: throughput / latency (HW only)
    retired: obsolete — scenario fully covered by another test; deselected (never runs, excluded from pass/fail stats)
    maintenance: temporarily parked (feature/substrate fix in progress); skipped and shown as 'maintenance: <reason>' in the summary
    sanity: the default set — one representative (test, transport) per scenario, distributed so the set covers every transport once without duplicating each test on all wires. Runs by default; --regression runs the full matrix.
    allow_fail: runs normally, but a FAILURE is NON-blocking (pipeline stays green); reported truthfully in its own summary group and as a red ⊗ (ran & failed, tolerated) matrix glyph. For known-flaky cells kept visible until fixed.
    second_chance: on a parallel-run failure the test is re-run ISOLATED (-n0, one at a time); the isolated result is FINAL. Recovered-on-retry shows as a green ↻ (flaky/recovered). For tests that pass reliably alone but flake under parallel emu load.

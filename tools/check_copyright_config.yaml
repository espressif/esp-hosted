# Config for the espressif/check-copyright pre-commit hook.
# Only staged files are checked; the ignore block below keeps vendored and
# upstream-verbatim trees (which carry their own upstream notices) untouched.

DEFAULT:
  perform_check: yes
  allowed_licenses:
    - Apache-2.0
    - Unlicense
    - CC0-1.0
    # Core headers shared by the GPL kmod and the Apache host are dual-licensed.
    # Both variants occur: one-line block comments yield a trailing space before */.
    - GPL-2.0-only OR Apache-2.0
    - 'GPL-2.0-only OR Apache-2.0 '
  license_for_new_files: Apache-2.0
  new_notice_c: |
    /*
     * SPDX-FileCopyrightText: {years} Espressif Systems (Shanghai) CO LTD
     *
     * SPDX-License-Identifier: {license}
     */
  new_notice_python: |
    # SPDX-FileCopyrightText: {years} Espressif Systems (Shanghai) CO LTD
    # SPDX-License-Identifier: {license}
  espressif_copyright: '{years} Espressif Systems (Shanghai) CO LTD'

# Our Linux kernel module — first-party GPL code. Checked (not ignored): the
# license must be GPL-2.0-only, but its established // header style is kept.
linux_kmod:
  perform_check: yes
  allowed_licenses:
    - GPL-2.0-only
    - GPL-2.0-only OR Apache-2.0
  license_for_new_files: GPL-2.0-only
  new_notice_c: |
    // SPDX-FileCopyrightText: {years} Espressif Systems (Shanghai) CO LTD
    // SPDX-License-Identifier: {license}
  espressif_copyright: '{years} Espressif Systems (Shanghai) CO LTD'
  include:
    - host/linux/eh_host_linux_kmod/

ignore:
  perform_check: no
  include:
    # Vendored / upstream-verbatim trees — carry their own notices, never rewrite.
    - .deps/
    - build/
    - managed_components/
    - common/serializers/third_party/
    - common/serializers/eh_proto_v2/src/proto/
    - tools/vendor/
    - port/idf_components/esp_wifi_remote/
    # Upstream lwip / esp_netif-lwip glue (BSD-3-Clause).
    - port/idf_components/lwip/
    - port/idf_components/esp_netif/lwip/
    # Apache mynewt/NimBLE-derived example — upstream ASF header block.
    - examples/bluetooth/esp_hosted_nimble/bleprph_wifi_coex/
